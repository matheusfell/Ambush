services:
  postgres:
    image: postgres:16-alpine
    container_name: ambush-postgres
    environment:
      POSTGRES_USER: ambush
      POSTGRES_PASSWORD: ambush
      POSTGRES_DB: ambush
    ports:
      - "5432:5432"
    volumes:
      - ambush_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambush -d ambush"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ambush_pgdata:
